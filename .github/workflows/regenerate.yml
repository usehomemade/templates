# Rebuilds every template from its create command once a week, checks that it
# installs, builds and answers on $PORT, and commits only when all of them pass.
name: Regenerate templates

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: oven-sh/setup-bun@v2
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Regenerate
        env:
          CI: "1"
        run: |
          git config --global user.name "homemade templates"
          git config --global user.email "templates@homemade.dev"
          for id in $(cat scripts/templates.txt); do ./scripts/generate.sh "$id"; done

      - name: Smoke check
        run: for id in $(cat scripts/templates.txt); do ./scripts/smoke.sh "$id"; done

      - name: Commit
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898499+github-actions[bot]@users.noreply.github.com" \
            commit -m "Regenerate templates $(date -u +%Y-%m-%d)"
          git push
