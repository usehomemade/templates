# Rebuilds every template from its create command once a week, smoke-checks each
# one in its own job (install from the lockfile, start every service the way a
# homemade VM does, check it answers), and commits only when all of them pass.
name: Regenerate templates

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      only:
        description: "Space-separated folders to regenerate (empty: all)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      ids: ${{ steps.ids.outputs.ids }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tools
      - id: ids
        env:
          ONLY: ${{ inputs.only }}
        run: |
          ids="${ONLY:-$(grep -v '^#' scripts/templates.txt)}"
          echo "ids=$(printf '%s\n' $ids | jq -R . | jq -sc .)" >>"$GITHUB_OUTPUT"
          echo "IDS=$(echo $ids)" >>"$GITHUB_ENV"
      - name: Check app setup scripts parse
        run: for f in apps/*/setup.sh; do bash -n "$f"; done
      - name: Regenerate
        env:
          CI: "1"
        run: |
          git config --global user.name "homemade templates"
          git config --global user.email "templates@homemade.dev"
          for id in $IDS; do ./scripts/generate.sh "$id"; done
          tar -czf generated.tgz $IDS
      - uses: actions/upload-artifact@v4
        with:
          name: generated
          path: generated.tgz
          retention-days: 3

  smoke:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        id: ${{ fromJSON(needs.generate.outputs.ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tools
      - uses: actions/download-artifact@v4
        with:
          name: generated
      - run: rm -rf "${{ matrix.id }}" && tar -xzf generated.tgz "${{ matrix.id }}"
      - run: ./scripts/smoke.sh "${{ matrix.id }}"

  commit:
    needs: [generate, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: generated
      - name: Commit
        env:
          IDS: ${{ join(fromJSON(needs.generate.outputs.ids), ' ') }}
        run: |
          rm -rf $IDS && tar -xzf generated.tgz && rm generated.tgz
          git add -A $IDS
          # Dev-only .env files are part of a template, even where the app's .gitignore skips them.
          for id in $IDS; do if [ -f "$id/.env" ]; then git add -f "$id/.env"; fi; done
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898499+github-actions[bot]@users.noreply.github.com" \
            commit -m "Regenerate templates $(date -u +%Y-%m-%d)"
          git push
