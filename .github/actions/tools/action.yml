name: Template tools
description: The runtimes a homemade VM ships (Node, pnpm, Bun, Python + uv, Go).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "26"
    - uses: pnpm/action-setup@v4
      with:
        version: latest
    - uses: oven-sh/setup-bun@v2
    - uses: astral-sh/setup-uv@v6
    - uses: actions/setup-go@v5
      with:
        go-version: stable
        cache: false
